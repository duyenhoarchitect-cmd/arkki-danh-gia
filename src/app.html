<title>Arkki Đánh giá học sinh</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Lexend:wght@500;600;700&display=swap">
<style>
/* Layout: sticky context bar (học kỳ / trường / lớp) over a tabbed work area; the grading sheet is the home view. */
:root {
  --paper: #f7f9f2; --surface: #ffffff; --sunk: #eef2e6;
  --ink: #1d2618; --muted: #5d6a55; --line: #d9e0cd;
  --leaf: #6f9e14; --leaf-ink: #ffffff; --leaf-soft: #e8f2d2;
  --rose: #c92c72; --rose-soft: #fbe6ef;
  --warn: #a86400; --warn-soft: #fdf0d9; --bad: #b3261e;
  --base: #3f6fc4;
  --f-display: "Lexend", "Be Vietnam Pro", system-ui, sans-serif;
  --f-body: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #121611; --surface: #1a2018; --sunk: #232b20;
  --ink: #e6ecdf; --muted: #a0ab96; --line: #2f3a2a;
  --leaf: #9ccc3c; --leaf-ink: #142008; --leaf-soft: #263317;
  --rose: #ef6aa7; --rose-soft: #3a1a29;
  --warn: #f0b35a; --warn-soft: #3a2b12; --bad: #f2867f; --base: #7aa2ec;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --paper: #121611; --surface: #1a2018; --sunk: #232b20;
  --ink: #e6ecdf; --muted: #a0ab96; --line: #2f3a2a;
  --leaf: #9ccc3c; --leaf-ink: #142008; --leaf-soft: #263317;
  --rose: #ef6aa7; --rose-soft: #3a1a29;
  --warn: #f0b35a; --warn-soft: #3a2b12; --bad: #f2867f; --base: #7aa2ec;
  color-scheme: dark; }
* { box-sizing: border-box; }
html, body { background: var(--paper); color: var(--ink); }
body { font: 14px/1.5 var(--f-body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
h2 { font-size: 1.25rem; } h3 { font-size: 1.02rem; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--rose); outline-offset: 2px; }
.gut { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 1240px; margin: 0 auto; }

/* top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; padding-block: 10px; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand img { height: 30px; width: auto; border-radius: 4px; }
.brand b { font-family: var(--f-display); font-size: 1rem; white-space: nowrap; }
.ctx { display: flex; flex-wrap: wrap; gap: 8px; flex: 1 1 420px; }
.ctx label { display: flex; flex-direction: column; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; gap: 2px; flex: 1 1 130px; min-width: 0; }
select, input[type=text], input[type=search], input[type=date], input[type=number], textarea {
  background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; width: 100%; min-width: 0; }
select { font-weight: 600; }
textarea { resize: vertical; line-height: 1.45; }
.save { font-size: 12px; color: var(--muted); white-space: nowrap; }
.save.err { color: var(--bad); font-weight: 600; }
.who { display: flex; align-items: center; gap: 8px; font-size: 12.5px; white-space: nowrap; }
.who b { max-width: 160px; overflow: hidden; text-overflow: ellipsis; }
.auth { max-width: 420px; margin: 8vh auto 0; display: grid; gap: 14px; }
.auth h1 { font-size: 1.5rem; }
.auth form { display: grid; gap: 10px; }
.auth .err { color: var(--bad); font-size: 13px; min-height: 1em; }
body.locked .ctx, body.locked .tabs, body.locked #saveState { display: none; }
.tabs { display: flex; gap: 4px; overflow-x: auto; padding-bottom: 0; }
.tabs button { border: 0; background: none; padding: 10px 12px 9px; border-bottom: 3px solid transparent; font-weight: 600; color: var(--muted); white-space: nowrap; }
.tabs button[aria-selected=true] { color: var(--ink); border-color: var(--leaf); }

main { padding-block: 18px 60px; }
.view { display: grid; gap: 18px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; min-width: 0; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.row > .grow { flex: 1 1 auto; min-width: 0; }
.muted { color: var(--muted); }
.small { font-size: 12.5px; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 7px 12px; font-weight: 600; }
.btn:hover { border-color: var(--leaf); }
.btn.pri { background: var(--leaf); color: var(--leaf-ink); border-color: var(--leaf); }
.btn.rose { background: var(--rose); color: #fff; border-color: var(--rose); }
.btn.ghost { border-color: transparent; background: none; color: var(--muted); }
.btn.danger { color: var(--bad); }
.btn.arm { background: var(--bad); color: #fff; border-color: var(--bad); }
.btn:disabled { opacity: .5; cursor: default; }
.pill { display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border-radius: 99px; font-size: 12px; font-weight: 600; background: var(--sunk); color: var(--muted); white-space: nowrap; }
.pill.ok { background: var(--leaf-soft); color: var(--leaf); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.rose { background: var(--rose-soft); color: var(--rose); }
.empty { padding: 28px 16px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: var(--r); }
.empty b { color: var(--ink); display: block; font-family: var(--f-display); margin-bottom: 4px; }
.note-box { background: var(--warn-soft); color: var(--ink); border-radius: 8px; padding: 10px 12px; font-size: 13px; }

/* lessons strip */
.lessons { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; }
.lesson { flex: 0 0 auto; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 10px; text-align: left; min-width: 78px; }
.lesson b { display: block; font-family: var(--f-display); font-size: 13px; }
.lesson span { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.lesson .bar { display: block; height: 3px; border-radius: 3px; background: var(--sunk); margin-top: 4px; overflow: hidden; }
.lesson .bar i { display: block; height: 100%; background: var(--leaf); }
.lesson[aria-pressed=true] { border-color: var(--leaf); background: var(--leaf-soft); }
.lesson.base b::after { content: " · đầu kỳ"; font-weight: 500; color: var(--base); font-size: 11px; }

/* grading sheet */
.sheet { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
.sheet table { border-collapse: collapse; width: 100%; min-width: 760px; }
.sheet th, .sheet td { border-bottom: 1px solid var(--line); padding: 8px; vertical-align: top; text-align: left; }
.sheet th { font-size: 11.5px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); background: var(--sunk); position: sticky; top: 0; font-weight: 600; }
.sheet tr.absent td { background: var(--sunk); }
.sheet tr.absent .scores { opacity: .35; pointer-events: none; }
.sheet td.n { color: var(--muted); font-variant-numeric: tabular-nums; width: 34px; }
.sheet td.name { min-width: 150px; font-weight: 600; }
.sheet td.name small { display: block; font-weight: 400; color: var(--muted); font-size: 11.5px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); width: 32px; height: 32px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--muted); }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed=true] { background: var(--leaf); color: var(--leaf-ink); }
.seg button:hover:not([aria-pressed=true]) { background: var(--leaf-soft); }
.scores { display: flex; gap: 8px 12px; flex-wrap: wrap; }
.scores .sc { display: flex; flex-direction: column; gap: 3px; }
.scores .sc span { font-size: 11px; color: var(--muted); }
td.note { width: 38%; }
td.note textarea { min-height: 56px; min-width: 220px; }
.chk { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); }
.sugg { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.sugg button { border: 1px dashed var(--line); background: var(--sunk); border-radius: 8px; padding: 4px 8px; font-size: 12px; text-align: left; }
.sugg button:hover { border-color: var(--leaf); }

/* summary */
.sum th, .sum td { white-space: nowrap; }
.sum td.v { font-variant-numeric: tabular-nums; text-align: center; }
.sum tr.click { cursor: pointer; }
.sum tr.click:hover td { background: var(--leaf-soft); }
.sum tr.on td { background: var(--leaf-soft); }
.detail { display: grid; grid-template-columns: minmax(0, 320px) minmax(0, 1fr); gap: 18px; }
@media (max-width: 820px) { .detail { grid-template-columns: minmax(0, 1fr); } }
.radar svg { width: 100%; height: auto; display: block; }
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
.legend i { display: inline-block; width: 14px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 5px; }
.fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 600px) { .fields { grid-template-columns: minmax(0, 1fr); } }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field > span { font-size: 12px; font-weight: 600; color: var(--muted); }
.final-text { min-height: 280px; font-size: 13.5px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; font-size: 13px; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; font-variant-numeric: tabular-nums; }

/* catalog */
.cat { display: grid; grid-template-columns: minmax(0, 260px) minmax(0, 1fr); gap: 18px; align-items: start; }
@media (max-width: 860px) { .cat { grid-template-columns: minmax(0, 1fr); } }
.list { display: flex; flex-direction: column; gap: 4px; }
.list button.item { text-align: left; border: 1px solid transparent; background: none; border-radius: 8px; padding: 7px 10px; display: flex; justify-content: space-between; gap: 8px; }
.list button.item:hover { background: var(--sunk); }
.list button.item[aria-current=true] { background: var(--leaf-soft); border-color: var(--leaf); font-weight: 600; }
.subtabs { display: flex; gap: 6px; flex-wrap: wrap; }
.subtabs button { border: 1px solid var(--line); background: var(--surface); padding: 6px 12px; border-radius: 99px; font-weight: 600; font-size: 13px; }
.subtabs button[aria-pressed=true] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.edit table { border-collapse: collapse; width: 100%; min-width: 620px; }
.edit th { font-size: 11.5px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); text-align: left; padding: 6px; }
.edit td { padding: 3px; vertical-align: top; }
.edit td input, .edit td textarea { padding: 6px 8px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.rub { overflow-x: auto; }
.rub table { border-collapse: collapse; min-width: 720px; width: 100%; }
.rub th, .rub td { border: 1px solid var(--line); padding: 6px; vertical-align: top; font-size: 13px; }
.rub th { background: var(--sunk); text-align: left; }
.rub textarea { min-height: 70px; border: 0; padding: 4px; background: transparent; }
.rub td.missing { background: var(--warn-soft); }
details summary { cursor: pointer; font-weight: 600; }

/* attendance, progress, lesson states, report workflow */
.att { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; margin: 6px 0 4px; }
.att button { border: 0; background: var(--surface); padding: 3px 8px; font-size: 12px; font-weight: 600; color: var(--muted); }
.att button + button { border-left: 1px solid var(--line); }
.att button[aria-pressed=true][data-v=present] { background: var(--leaf); color: var(--leaf-ink); }
.att button[aria-pressed=true][data-v=absent] { background: var(--bad); color: #fff; }
.att button[aria-pressed=true][data-v=unknown] { background: var(--ink); color: var(--paper); }
.att button:disabled, .seg button:disabled { cursor: default; }
.sheet tr.unk td { background: var(--sunk); }
.sheet tr.unk .scores { opacity: .35; pointer-events: none; }
.sheet td.name small.by { margin-top: 2px; }
.progress { height: 6px; background: var(--sunk); border-radius: 6px; overflow: hidden; flex: 1 1 140px; max-width: 240px; }
.progress i { display: block; height: 100%; background: var(--leaf); }
.tools { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; margin-top: 12px; }
.tools input[type=search] { max-width: 240px; }
.lesson.cancelled { opacity: .55; }
.lesson.cancelled b { text-decoration: line-through; }
.lesson .lk { color: var(--base); font-weight: 600; }
.who select { width: auto; padding: 4px 6px; font-size: 12.5px; }
.pill.bad { background: var(--rose-soft); color: var(--bad); }
.pill.blue { background: var(--sunk); color: var(--base); }
.status-box { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: grid; gap: 8px; background: var(--sunk); }
.ask { border-color: var(--rose); display: grid; gap: 10px; }
.hist { font-size: 12.5px; color: var(--muted); margin: 6px 0 0; padding-left: 18px; }
textarea[readonly] { background: var(--sunk); color: var(--muted); }
.rev td, .rev th { white-space: normal; }
.radio { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; }

/* lesson library and comment pickers */
.libmod { display: grid; gap: 4px; padding-top: 8px; border-top: 1px solid var(--line); }
.libmod > .row > button { border: 0; background: none; padding: 0; text-align: left; font-weight: 700; font-family: var(--f-display); }
.libmod > .row > button[aria-current=true] { color: var(--leaf); }
.list button.item.add { color: var(--muted); font-size: 12.5px; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chips button { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 2px 9px; font-size: 12px; font-weight: 600; }
.chips button[aria-pressed=true] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.picker { margin-top: 8px; border: 1px solid var(--line); border-radius: 8px; padding: 8px; display: grid; gap: 6px; background: var(--sunk); }
.picks { display: grid; gap: 4px; max-height: 340px; overflow: auto; }
.pick { display: block; width: 100%; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 8px; font-size: 12.5px; line-height: 1.45; }
.pick small { display: block; color: var(--muted); font-size: 11px; margin-top: 2px; }
.pick.on { border-color: var(--leaf); background: var(--leaf-soft); }
.cm td textarea { min-height: 40px; }
.cm td select { width: auto; }
.goal { white-space: pre-line; }
@media (prefers-reduced-motion: no-preference) { .lesson .bar i { transition: width .3s ease; } }
@media (max-width: 640px) {
  .sheet table, .sheet thead, .sheet tbody, .sheet tr, .sheet td { display: block; min-width: 0; }
  .sheet table { min-width: 0; }
  .sheet thead { display: none; }
  .sheet tr { border-bottom: 1px solid var(--line); padding: 8px 4px; }
  .sheet td { border: 0; padding: 4px 6px; }
  .sheet td.n { display: none; }
  td.note { width: auto; }
  td.note textarea { min-width: 0; }
}
</style>

<header class="top">
  <div class="wrap gut">
    <div class="brand"><img src="data:image/png;base64,%%IMG1%%" alt="Arkki"><b>Đánh giá học sinh</b></div>
    <div class="ctx">
      <label>Học kỳ<select id="selSem"></select></label>
      <label>Trường<select id="selSchool"></select></label>
      <label>Lớp<select id="selClass"></select></label>
    </div>
    <span class="save" id="saveState" aria-live="polite"></span>
    <span class="who" id="who" hidden></span>
  </div>
  <div class="wrap gut">
    <nav class="tabs" role="tablist" id="tabs">
      <button role="tab" data-tab="cham">Chấm điểm</button>
      <button role="tab" data-tab="tonghop">Tổng hợp &amp; nhận xét cuối kỳ</button>
      <button role="tab" data-tab="duyet">Duyệt report</button>
      <button role="tab" data-tab="danhmuc">Danh mục</button>
      <button role="tab" data-tab="caidat">Cài đặt mẫu in</button>
    </nav>
  </div>
</header>
<main class="gut"><div class="wrap view" id="view"></div></main>

  totalLabel: 'Tổng điểm',

function parseDate(v) {
  if (v == null || v === '') return '';
  if (v instanceof Date) return v.toISOString().slice(0, 10);
  if (typeof v === 'number') { const d = new Date(Math.round((v - 25569) * 864e5)); return d.toISOString().slice(0, 10); }
  const s = String(v).trim();
  let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/); if (m) return m[1] + '-' + m[2].padStart(2, '0') + '-' + m[3].padStart(2, '0');
  m = s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})/);

// ---------- storage: Supabase (web app), Claude shared db (artifact), or browser storage (trial) ----------
const SB_TABLE = { semesters: 'semesters', schools: 'schools', classes: 'classes', students: 'students', lessons: 'lessons', records: 'records', settings: 'settings' };
const snake = k => k === 'order' ? 'sort_order' : k.replace(/[A-Z]/g, c => '_' + c.toLowerCase());
const camel = k => k === 'sort_order' ? 'order' : k.replace(/_([a-z])/g, (_, c) => c.toUpperCase());
const SKIP_COLS = new Set(['created_at', 'updated_at', 'updated_by']);
function toRow(coll, id, data) {
  if (coll === 'settings') return { id, data };
  const r = { id }; for (const [k, v] of Object.entries(data)) if (k !== 'id') r[snake(k)] = v; return r;
}
function fromRow(coll, row) {
  if (coll === 'settings') return { id: row.id, ...(row.data || {}) };
  const o = {}; for (const [k, v] of Object.entries(row)) if (!SKIP_COLS.has(k)) o[camel(k)] = v; return o;
}
const Store = (() => {
  let db = null, sb = null, mode = 'local';
  const LKEY = 'arkki-local-db';
  let local = lsGet(LKEY) || {};
  const watchers = new Set();
  const persist = () => { lsSet(LKEY, local); for (const w of watchers) w.fire(); };
  const rows = (coll, field, value) => Object.entries(local[coll] || {}).map(([id, d]) => ({ id, ...d })).filter(r => !field || r[field] === value);
  const deepMerge = (a, b) => { const o = { ...(a || {}) }; for (const [k, v] of Object.entries(b)) o[k] = v && typeof v === 'object' && !Array.isArray(v) ? deepMerge(o[k], v) : v; return o; };
  const sbErr = e => { const m = e?.message || String(e); return { code: /row-level security|not allowed|permission/i.test(m) || e?.code === '42501' ? 'forbidden' : 'unavailable', message: m }; };
  const sbCheck = r => { if (r.error) throw sbErr(r.error); return r.data; };
  async function sbList(coll, field, value) {
    let q = sb.from(SB_TABLE[coll]).select('*');
    if (field) q = q.eq(snake(field), value);
    return sbCheck(await q.limit(5000)).map(r => fromRow(coll, r));
  }
  return {
    get mode() { return mode; },
    get sb() { return sb; },
    async init() {
      const cfg = window.ARKKI_CONFIG;
      if (cfg?.supabaseUrl && cfg?.supabaseKey && window.supabase) {
        sb = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseKey, { auth: { persistSession: true, autoRefreshToken: true } });
        mode = 'supabase'; return mode;
      }
      try { if (window.claude?.use) db = await window.claude.use('db'); } catch { db = null; }
      if (db) mode = 'db';
      return mode;
    },
    watch(coll, field, value, cb, onErr) {
      if (mode === 'supabase') {
        let alive = true, timer = null;
        const load = () => sbList(coll, field, value).then(r => { if (alive) cb(r); }).catch(e => onErr && onErr(e));
        const later = () => { clearTimeout(timer); timer = setTimeout(load, 250); };
        const ch = sb.channel('w-' + coll + '-' + (value || 'all') + '-' + Math.random().toString(36).slice(2, 7));
        const spec = { schema: 'public', table: SB_TABLE[coll] };
        ch.on('postgres_changes', field ? { ...spec, event: 'INSERT', filter: snake(field) + '=eq.' + value } : { ...spec, event: '*' }, later);
        if (field) { ch.on('postgres_changes', { ...spec, event: 'UPDATE', filter: snake(field) + '=eq.' + value }, later); ch.on('postgres_changes', { ...spec, event: 'DELETE' }, later); }
        ch.subscribe(st => { if (st === 'SUBSCRIBED') load(); });
        load();
        return () => { alive = false; clearTimeout(timer); sb.removeChannel(ch); };
      }
      if (mode === 'db') {
        let q = db.collection(coll); if (field) q = q.where(field, '==', value);
        return q.onSnapshot(s => cb(s.docs.map(d => ({ id: d.id, ...d.data() }))), e => onErr && onErr(e));
      }
      const w = { fire: () => cb(rows(coll, field, value)) };
      watchers.add(w); setTimeout(w.fire, 0);
      return () => watchers.delete(w);
    },
    async list(coll, field, value) {
      if (mode === 'supabase') return sbList(coll, field, value);
      if (mode === 'db') { let q = db.collection(coll); if (field) q = q.where(field, '==', value); const s = await q.get(); return s.docs.map(d => ({ id: d.id, ...d.data() })); }
      return rows(coll, field, value);
    },
    async set(coll, id, data) {
      if (mode === 'supabase') { sbCheck(await sb.from(SB_TABLE[coll]).upsert(toRow(coll, id, data))); return; }
      if (mode === 'db') return db.collection(coll).doc(id).set(data);
      (local[coll] ||= {})[id] = JSON.parse(JSON.stringify(data)); persist();
    },
    async update(coll, id, data) {
      if (mode === 'supabase') {
        if (coll === 'records') {
          const [classId, studentId] = id.split('__');
          sbCheck(await sb.rpc('merge_record', { p_id: id, p_class_id: classId, p_student_id: studentId, p_patch: data }));
          return;
        }
        if (coll === 'settings') { const cur = (await sbList('settings')).find(r => r.id === id) || {}; return this.set(coll, id, deepMerge(cur, data)); }
        const row = toRow(coll, id, data); delete row.id;
        sbCheck(await sb.from(SB_TABLE[coll]).update(row).eq('id', id));
        return;
      }
      if (mode === 'db') return db.collection(coll).doc(id).update(data);
      if (!local[coll]?.[id]) throw { code: 'invalid_argument', message: 'missing' };
      local[coll][id] = deepMerge(local[coll][id], JSON.parse(JSON.stringify(data))); persist();
    },
    async del(coll, id) {
      if (mode === 'supabase') { sbCheck(await sb.from(SB_TABLE[coll]).delete().eq('id', id)); return; }
      if (mode === 'db') return db.collection(coll).doc(id).delete();
      if (local[coll]) delete local[coll][id]; persist();
    },
  };
})();

// ---------- lesson library (one document, settings/library): modules -> lessons -> comment sentences ----------
// comment.kind: daily (per lesson), final (end-of-term teacher comment), suggest (development suggestion), quick (short line per criterion).
const LIB_KIND = { daily: 'Nhận xét hằng ngày', final: 'Nhận xét cuối kỳ', suggest: 'Đề xuất phát triển', quick: 'Câu nhanh theo năng lực' };
const lib = () => S.library || { modules: [], lessons: [], comments: [] };
const libClone = () => JSON.parse(JSON.stringify(lib()));
const libModules = () => [...lib().modules].sort((a, b) => (a.order ?? 0) - (b.order ?? 0));
const libLessonsOf = mid => lib().lessons.filter(l => l.moduleId === mid).sort((a, b) => (a.order ?? 0) - (b.order ?? 0));
const libComments = (kind, lessonId) => lib().comments.filter(c => c.kind === kind && (!lessonId || c.lessonId === lessonId));
// "Lớp áp dụng" holds class names or their beginning: "6" fits 6A1 and 6A2, "Arkki" fits Arkki 1-3. Empty fits every class.
const libFitsClass = (l, className) => {
  const tags = (l.classes || []).map(fold).filter(Boolean);
  if (!tags.length || !className) return true;
  const c = fold(className); return tags.some(t => c === t || c.startsWith(t));
};
const parenOf = s => (String(s || '').match(/\(([^)]+)\)/) || [])[1] || '';
// The library lesson of a class session: the explicit link, else a lesson with the same name (or the same name in brackets).
function libLessonFor(buoi) {

  const L = lib().lessons;

  const p = fold(buoi.project), pp = fold(parenOf(buoi.project));

  const hits = L.filter(x => { const n = fold(x.name), np = fold(parenOf(x.name)); return n === p || (np && (np === p || np === pp)) || (pp && n === pp); });
  return hits.find(x => libFitsClass(x, klass()?.name)) || hits[0] || null;
}
function saveLibrary(next) { S.library = next; return write(() => Store.set('settings', 'library', next)); }
const cmKey = c => [c.kind, c.lessonId || '', c.comp || '', c.level, fold(c.text)].join('|');

function mergeLibrary(add) {
  const next = libClone(), st = { modules: 0, lessons: 0, comments: 0, dup: 0 }, modMap = {}, lesMap = {};
  for (const m of add.modules || []) {
    let ex = next.modules.find(x => x.id === m.id || fold(x.name) === fold(m.name));
    if (!ex) { ex = { id: next.modules.some(x => x.id === m.id) ? uid() : m.id, name: m.name, order: next.modules.length + 1 }; next.modules.push(ex); st.modules++; }
    modMap[m.id] = ex.id;
  }
  for (const l of add.lessons || []) {
    const mid = modMap[l.moduleId] || l.moduleId;
    let ex = next.lessons.find(x => x.moduleId === mid && fold(x.name) === fold(l.name));
    if (!ex) { ex = { ...l, id: next.lessons.some(x => x.id === l.id) ? uid() : l.id, moduleId: mid, order: next.lessons.filter(x => x.moduleId === mid).length + 1 }; next.lessons.push(ex); st.lessons++; }
    lesMap[l.id] = ex.id;

    if (c.lessonId) n.lessonId = lesMap[c.lessonId] || c.lessonId;

// ---------- calculations (spec BR-01..03) ----------
function levelOf(x, max) { if (x == null) return null; return Math.min(max, Math.max(1, Math.floor(x + 0.5 + 1e-9))); }

// A cancelled lesson stays in the history but never counts. The first lesson that is not cancelled is the baseline.

// Attendance: present / absent / unknown (not yet observed). Old data without `att` counts as present when it has a score.

function entryState(e, comps) {

// ---------- enrolment: transfers and leaving keep every grade ----------
// A student doc is one enrolment in one class. Fields: joinedAt / leftAt (dates), status 'moved' | 'left',

// A transfer keeps the old enrolment and its grades; the new class's report adds the lessons attended before.
const STU = new Map();   // studentId -> student doc, for every class loaded so far

}
const byDate = (a, b) => String(a.date || '9999').localeCompare(String(b.date || '9999')) || (a.order ?? 0) - (b.order ?? 0);
function mergeHist(studentId, lessons, rec) {
  const st = STU.get(studentId), h = HIST.get(studentId);
  let ls = st ? lessons.filter(l => enrolledOn(st, l.date)) : lessons;
  if (h?.lessons.length) { ls = [...h.lessons, ...ls].sort(byDate); rec = { ...(rec || {}), s: { ...h.s, ...(rec?.s || {}) } }; }
  return { lessons: ls, rec };
}
// Follow movedFrom links (up to 5 hops) and keep the lessons attended in each earlier class. Resolves true if anything new loaded.
async function loadHist(students) {
  let changed = false;
  for (const st of students) {
    if (!st.movedFrom || HIST.has(st.id)) continue;
    const lessons = [], s = {}; let cur = st, hops = 0;
    while (cur?.movedFrom && hops++ < 5) {
      const { classId, studentId } = cur.movedFrom;
      const [ls, recs, sts] = await Promise.all([Store.list('lessons', 'classId', classId), Store.list('records', 'classId', classId), Store.list('students', 'classId', classId)]);
      const prev = knowStudents(sts).find(x => x.id === studentId); if (!prev) break;
      const rec = recs.find(r => r.studentId === studentId);
      for (const l of ls.filter(l => enrolledOn(prev, l.date))) { lessons.push({ ...l, fromClass: classId }); if (rec?.s?.[l.id]) s[l.id] = rec.s[l.id]; }
      cur = prev;
    }
    HIST.set(st.id, { lessons, s }); changed = true;
  }
  return changed;
}

function lessonProgress(lesson, students, records, comps) {
  students = students.filter(st => enrolledOn(st, lesson.date));
  const o = { full: 0, partial: 0, absent: 0, unknown: 0, total: students.length };
  for (const st of students) o[entryState(records[st.id]?.s?.[lesson.id], comps)]++;
  o.done = o.full + o.absent; o.complete = o.done === o.total;
  return o;
}

// merged = true when the caller already passed the lessons through mergeHist.
function studentStats(studentId, lessons, rec, comps, merged) {
  if (!merged) ({ lessons, rec } = mergeHist(studentId, lessons, rec));
  const s = rec?.s || {};
  lessons = activeLessons(lessons);
  const baseLesson = lessons[0];
  const baseline = {}, final = {}, count = {};
  for (const c of comps) {
    const be = baseLesson && s[baseLesson.id];
    const b = isPresent(be) ? be[c.code] : null;
    baseline[c.code] = typeof b === 'number' ? b : null;
    let sum = 0, n = 0;
    for (const l of lessons.slice(1)) { const e = s[l.id]; if (!isPresent(e)) continue; const v = e[c.code]; if (typeof v === 'number') { sum += v; n++; } }
    final[c.code] = n ? sum / n : null; count[c.code] = n;
  }
  let graded = 0;
  for (const l of lessons) if (entryState(s[l.id], comps) === 'full') graded++;
  return { baseline, final, count, graded, nLessons: lessons.length };
}

// Decision 16/11: the 4 teacher fields are optional; any gap only marks the student "Chưa xong", never blocks export.
const FIN_FIELDS = [['general', 'nhận xét chung'], ['positive', 'điểm tích cực'], ['develop', 'nội dung cần phát triển'], ['suggest', 'đề xuất']];
function studentStatus(stats, comps, fin) {
  const why = [];
  const noBase = comps.filter(c => stats.baseline[c.code] == null).map(c => c.name);
  const noFinal = comps.filter(c => stats.final[c.code] == null).map(c => c.name);
  if (noBase.length) why.push('thiếu điểm đầu kỳ: ' + noBase.join(', '));
  if (noFinal.length) why.push('thiếu điểm cuối kỳ: ' + noFinal.join(', '));
  const empty = FIN_FIELDS.filter(([k]) => !String(fin?.[k] || '').trim()).map(x => x[1]);
  if (empty.length) why.push('chưa có ' + empty.join(', '));
  return { done: !why.length, why };
}

// Report workflow (decision 16/11: only the end-of-term report is approved, never single lessons).
// draft -> submitted -> approved | returned. Approving stores a snapshot; changing it later starts a new version.
const REPORT = { draft: ['Nháp', ''], submitted: ['Chờ duyệt', 'blue'], approved: ['Đã duyệt', 'ok'], returned: ['Bị trả lại', 'bad'] };
const repStatus = fin => REPORT[fin?.status] ? fin.status : 'draft';
const repVersion = fin => fin?.version || 1;
function repPill(fin) {
  const s = repStatus(fin), [label, cls] = REPORT[s];
  return '<span class="pill ' + cls + '">' + label + (s === 'approved' ? ' · v' + (fin.approved?.version || repVersion(fin)) : repVersion(fin) > 1 ? ' · v' + repVersion(fin) : '') + '</span>';
}
const isSerious = w => /^Thiếu mô tả/.test(w);
// Everything printed for one student, computed from live data. Also used as the approval snapshot.
function reportOf(st, lessons, rec, sch, sem) {
  const comps = activeComps(sch);
  ({ lessons, rec } = mergeHist(st.id, lessons, rec || {}));
  rec = rec || {};
  const stats = studentStats(st.id, lessons, rec, comps, true), fin = rec.fin || {};
  const g = genComment(st, stats, sch, sem, fin);
  return {
    name: st.name, code: st.code || '', comment: fin.textEdited ? (fin.text || '') : g.text, warnings: g.warnings,
    baseline: stats.baseline, final: stats.final, count: stats.count,
    rows: activeLessons(lessons).map(l => {
      const e = rec.s?.[l.id] || {}, scores = {};
      if (isPresent(e)) comps.forEach(c => { if (typeof e[c.code] === 'number') scores[c.code] = e[c.code]; });
      return { date: l.date, project: l.project, note: e.note || '', absent: attOf(e) === 'absent', scores };
    }),
  };
}
function genComment(st, stats, sc, sem, fin) {
  const comps = activeComps(sc), max = maxLevel(sc), set = settings();
  const EPS = 1e-9;
  const withFinal = comps.filter(c => stats.final[c.code] != null);
  const warnings = [];
  const desc = (c, l) => { const t = rubricText(sc, c.code, l); if (!t) warnings.push('Thiếu mô tả cấp ' + l + ' cho "' + c.name + '" (Danh mục → Trường).'); return t; };
  let best = '', low = '', prog = '';
  if (withFinal.length < comps.length) warnings.push('Chưa đủ dữ liệu cuối kỳ cho: ' + comps.filter(c => stats.final[c.code] == null).map(c => c.name).join(', ') + '.');
  if (withFinal.length) {
    const vals = withFinal.map(c => stats.final[c.code]);
    const hi = Math.max(...vals), lo = Math.min(...vals);
    const top = withFinal.filter(c => stats.final[c.code] > hi - EPS);
    const bottom = withFinal.filter(c => stats.final[c.code] < lo + EPS);
    const same = hi - lo < EPS && withFinal.length > 1;
    best = (same ? '+ Các tiêu chí đang thể hiện ở mức tương đương.\n' : '') +
      top.map(c => { const x = stats.final[c.code], l = levelOf(x, max); return '+ ' + c.name + ', cấp độ ' + fmt2(x) + ': ' + desc(c, l); }).join('\n');
    low = bottom.map(c => {
      const x = stats.final[c.code], l = levelOf(x, max);
      let t = '+ ' + c.name + ', cấp độ ' + fmt2(x) + ': ' + desc(c, l);
      if (l < max) t += (/[.!?…]$/.test(t) ? ' ' : '. ') + 'Cấp độ ' + (l + 1) + ' của tiêu chí này mà học sinh có thể đạt được tiếp theo là: ' + desc(c, l + 1);
      else t += (/[.!?…]$/.test(t) ? ' ' : '. ') + 'Học sinh đã ở cấp độ cao nhất, tiếp tục duy trì và mở rộng vận dụng trong các dự án mới.';
      return t;
    }).join('\n');
    const withDelta = withFinal.filter(c => stats.baseline[c.code] != null);
    if (withDelta.length) {
      const deltas = withDelta.map(c => stats.final[c.code] - stats.baseline[c.code]);
      const dmax = Math.max(...deltas);
      if (dmax > EPS) {
        prog = withDelta.filter((c, i) => deltas[i] > dmax - EPS).map(c => {
          const b = stats.baseline[c.code], f = stats.final[c.code];
          return '+ ' + c.name + ': từ cấp độ ' + fmtNum(b) + ' đầu kỳ lên ' + fmt2(f) + ' cuối kỳ. ' + desc(c, levelOf(f, max));
        }).join('\n');
      } else {
        prog = '+ Học sinh duy trì mức biểu hiện ổn định ở các tiêu chí so với đầu kỳ.';
        if (dmax < -EPS) warnings.push('Không tiêu chí nào tăng so với đầu kỳ. Giáo viên nên rà soát lại trước khi in.');
      }
    } else warnings.push('Chưa có điểm đầu kỳ (buổi 1) nên không tính được tiến bộ.');
  }
  const gvNx = [fin.general, fin.positive, fin.develop].map(x => (x || '').trim()).filter(Boolean).join('\n');
  const gvGd = (fin.suggest || '').trim();
  if (!gvGd) warnings.push('Chưa có đề xuất phát triển của giáo viên.');
  const keys = { '[HOC_KY]': (sem?.name || '').replace(/^./, ch => ch.toLowerCase()), '[HO_TEN_HOC_SINH]': st.name, '[TIEUCHI_CHENHLECH]': prog, '[CAPDO_CAONHAT]': best, '[CAPDO_THAPNHAT]': low, '[GIAOVIEN_NHANXET]': gvNx, '[GIAOVIEN_GIUPDO]': gvGd };
  const out = [];
  for (const line of set.commentTpl.split('\n')) {
    const t = line.trim();
    if (t in keys && !keys[t]) { if (out.length && /:\s*$/.test(out[out.length - 1])) out.pop(); continue; }
    out.push(line.replace(/\[[A-Z_]+\]/g, k => k in keys ? keys[k] : k));
  }
  return { text: out.join('\n').replace(/\n{3,}/g, '\n\n').trim(), warnings: [...new Set(warnings)] };
}

function subscribeClass() {
  if (S.loadedClass === S.sel.cls) return;
  classUnsubs.forEach(u => u()); classUnsubs = [];
  S.students = []; S.lessons = []; S.records = {}; S.loadedClass = S.sel.cls; HIST.clear();
  if (!S.sel.cls) return;
  const id = S.sel.cls;
  classUnsubs.push(Store.watch('students', 'classId', id, r => {
    S.students = knowStudents(r.sort(byOrder)); render();
    loadHist(S.students).then(ch => { if (ch && S.loadedClass === id) render(); }).catch(() => {});
  }));
  classUnsubs.push(Store.watch('lessons', 'classId', id, r => { S.lessons = r.sort((a, b) => (a.order - b.order) || String(a.date).localeCompare(String(b.date))); render(); }));
  classUnsubs.push(Store.watch('records', 'classId', id, r => {
    // keep local values for fields with unsaved typing
    const next = {}; for (const x of r) next[x.studentId] = x;
    for (const [sid, p] of Object.entries(pendingNotes)) if (next[sid]) mergeLocal(next[sid], p);
    S.records = next; render();
  }));
}

  if (!force && a && $('#view').contains(a) && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) { renderPending = true; return; }
  renderPending = false;
  const y = window.scrollY;
  const fn = { cham: viewCham, tonghop: viewTongHop, duyet: viewDuyet, danhmuc: viewDanhMuc, caidat: viewCaiDat }[S.sel.tab] || viewCham;
  $('#view').innerHTML = askBox() + fn();

}

// Sentences of the session's library lesson + quick lines per criterion + the school's older free-text library.
function pickPool(L, LL, comps) {
  const sc = school(), codes = new Set(comps.map(c => c.code));
  const old = (sc?.library || []).filter(x => !x.lesson || x.lesson === L.project).map((x, i) => ({ id: 'old' + i, kind: 'daily', comp: x.comp || '', level: Number(x.level) || 0, text: x.text }));
  return [...(LL ? libComments('daily', LL.id) : []), ...old, ...libComments('quick').filter(c => !c.comp || codes.has(c.comp))];
}
const noteHas = (note, text) => fold(note).includes(fold(text));
function pickerHtml(st, e, comps, L, LL) {

// A cancelled lesson and a locked baseline accept no score or attendance change.
function lessonReadOnly() {
  const L = S.lessons.find(l => l.id === S.sel.lesson); if (!L) return true;
  return !!L.cancelled || (L.id === activeLessons(S.lessons)[0]?.id && !!L.locked);
}
async function patchRecord(studentId, patch) {
  if (patch.s) {
    let graded = false;
    for (const p of Object.values(patch.s)) if (COMPS.some(c => c.code in p) || 'absent' in p || 'att' in p) { Object.assign(p, stamp()); graded = true; }
    // Decision 16/11: two teachers may grade the same lesson; the last edit wins and keeps the editor's name.
    // A score change after the report was sent or approved sends it back to draft (a new version once approved).
    const fin = S.records[studentId]?.fin || {}, rs = repStatus(fin);
    if (graded && (rs === 'submitted' || rs === 'approved')) {
      patch.fin = { ...(patch.fin || {}), status: 'draft', version: repVersion(fin) + (rs === 'approved' ? 1 : 0),
        reopened: 'Điểm hoặc điểm danh đã đổi sau khi ' + (rs === 'approved' ? 'duyệt' : 'gửi duyệt') + '. Cần gửi duyệt lại.',
        history: [...(fin.history || []), { act: 'auto-reopen', ...stamp() }] };
    }
  }
  const id = recId(S.sel.cls, studentId);
  const exists = !!S.records[studentId];
  const rec = S.records[studentId] || (S.records[studentId] = { id, classId: S.sel.cls, studentId, s: {}, fin: {} });
  mergeLocal(rec, patch);
  await write(async () => {
    if (exists || Store.mode === 'supabase') { try { await Store.update('records', id, patch); return; } catch (e) { if (e?.code !== 'invalid_argument' || Store.mode !== 'db') throw e; } }
    const full = { classId: S.sel.cls, studentId, s: rec.s || {}, fin: rec.fin || {} };
    await Store.set('records', id, full);
  });
}
const noteTimers = {};
function queueNote(studentId, patch) {
  pendingNotes[studentId] = pendingNotes[studentId] || {};
  mergeLocal(pendingNotes[studentId], patch);
  const rec = S.records[studentId] || (S.records[studentId] = { classId: S.sel.cls, studentId, s: {}, fin: {} });
  mergeLocal(rec, patch);
  setSave('', 'Chưa lưu…');
  clearTimeout(noteTimers[studentId]);
  noteTimers[studentId] = setTimeout(() => flushNote(studentId), 900);
}
function flushNote(studentId) {
  clearTimeout(noteTimers[studentId]);
  const p = pendingNotes[studentId]; if (!p) return;
  delete pendingNotes[studentId];
  patchRecord(studentId, p).catch(() => { pendingNotes[studentId] = Object.assign(p, pendingNotes[studentId] || {}); });
}

// Library suggestions for "Nhận xét chung" (final) and "Đề xuất phát triển" (suggest), at the student's average end-of-term level.
const FIN_PICK = { general: ['final', 'Nhận xét chung'], suggest: ['suggest', 'Đề xuất phát triển'] };
function avgLevel(stats, comps, sc) {

function finPicker(st, stats, comps, sc, fin) {

  return h + '<div class="picker"><div class="row"><b class="small grow">Chèn vào ô "' + FIN_PICK[f][1] + '"</b><label class="chk" style="color:var(--ink)"><input type="checkbox" data-act="finAll"' + (S.ui.finAll ? ' checked' : '') + '> Hiện mọi cấp</label></div>' +

      '<small>cấp ' + c.level + (u ? ' · đã dùng cho ' + u + ' bạn cùng lớp' : '') + (on ? ' · bấm để gỡ' : '') + '</small></button>'; }).join('') + '</div>' +
    '<div class="small muted">Nên chọn câu khác nhau giữa các học sinh cùng lớp, rồi sửa lại cho đúng với từng bạn.</div></div>';

// Add a sentence to a text, or take it out again if it is already there.
function toggleSentence(text, s) {
  if (noteHas(text, s)) return text.replace(s, '').replace(/[ \t]*\n[ \t]*\n+/g, '\n').replace(/^\s+|\s+$/g, '');
  return (text.trim() ? text.trim() + '\n' : '') + s;
}

function drawRadar() {
  const el = $('#radar'); if (!el) return;
  const sc = school(), comps = activeComps(sc), max = maxLevel(sc);
  const st = S.students.find(s => s.id === S.sel.student); if (!st) return;
  const stats = studentStats(st.id, S.lessons, S.records[st.id], comps);
  const W = 380, H = 300, cx = W / 2, cy = 158, R = 100, n = comps.length;
  const pt = (i, v) => { const a = -Math.PI / 2 + i * 2 * Math.PI / n; return [cx + Math.cos(a) * R * v / max, cy + Math.sin(a) * R * v / max]; };
  let s = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Biểu đồ năng lực">';
  for (let k = 1; k <= max; k++) s += '<polygon points="' + comps.map((c, i) => pt(i, k).join(',')).join(' ') + '" fill="none" stroke="var(--line)" stroke-width="1"/>';
  comps.forEach((c, i) => { const [x, y] = pt(i, max); s += '<line x1="' + cx + '" y1="' + cy + '" x2="' + x + '" y2="' + y + '" stroke="var(--line)"/>'; });
  for (let k = 1; k <= max; k++) s += '<text x="' + (cx + 3) + '" y="' + (cy - R * k / max + 11) + '" font-size="9" fill="var(--muted)">' + k + '</text>';
  const poly = (vals, color, op) => {
    const ok = comps.every(c => vals[c.code] != null);
    const pts = comps.map((c, i) => pt(i, vals[c.code] ?? 0));
    let o = ok ? '<polygon points="' + pts.map(p => p.join(',')).join(' ') + '" fill="' + color + '" fill-opacity="' + op + '" stroke="' + color + '" stroke-width="2"/>' : '';
    comps.forEach((c, i) => { if (vals[c.code] != null) o += '<circle cx="' + pts[i][0] + '" cy="' + pts[i][1] + '" r="3.5" fill="' + color + '"/>'; });
    return o;
  };
  s += poly(stats.baseline, 'var(--base)', 0.08) + poly(stats.final, 'var(--leaf)', 0.18);
  comps.forEach((c, i) => {
    const [x, y] = pt(i, max * 1.2);
    const anchor = Math.abs(x - cx) < 8 ? 'middle' : x > cx ? 'start' : 'end';
    s += '<text x="' + x + '" y="' + (y + 4) + '" text-anchor="' + anchor + '" font-size="11.5" font-weight="600" fill="var(--ink)">' + esc(c.name) + '</text>';
  });
  el.innerHTML = s + '</svg>';
}

// ---------- report workflow: submit, approve, return ----------
// An item is { cls, sch, sem, st, lessons, rec }; rec is mutated locally after a successful write.
async function approveItems(items) {
  const res = [];
  for (const it of items) {
    const rep = reportOf(it.st, it.lessons, it.rec, it.sch, it.sem);
    const serious = rep.warnings.filter(isSerious);
    // Decision: a missing rubric description blocks approval; other gaps only warn. One bad item never stops the batch.
    if (serious.length) { res.push({ name: it.st.name, ok: false, why: serious[0] }); continue; }
    delete rep.warnings;
    const fin = it.rec?.fin || {}, version = repVersion(fin);
    const patch = { fin: { status: 'approved', returned: null, reopened: '', approved: { version, ...stamp(), report: rep }, history: [...(fin.history || []), { act: 'approve', version, ...stamp() }] } };
    try {
      await write(() => Store.update('records', recId(it.cls.id, it.st.id), patch));
      mergeLocal(it.rec, patch); res.push({ name: it.st.name, ok: true });
    } catch (e) { res.push({ name: it.st.name, ok: false, why: 'lưu lỗi' }); }
  }
  return res;
}
async function returnItems(items, reason) {
  let n = 0;
  for (const it of items) {
    const fin = it.rec?.fin || {};
    const patch = { fin: { status: 'returned', returned: { reason, ...stamp() }, history: [...(fin.history || []), { act: 'return', reason, version: repVersion(fin), ...stamp() }] } };
    try { await write(() => Store.update('records', recId(it.cls.id, it.st.id), patch)); mergeLocal(it.rec, patch); n++; } catch {}
  }
  return n;
}
const curItem = () => { const st = S.students.find(s => s.id === S.sel.student); return { cls: klass(), sch: school(), sem: semester(), st, lessons: S.lessons, rec: S.records[st.id] }; };
function finStep(act, patchFin) {
  const st = S.sel.student, fin = S.records[st]?.fin || {};
  flushNote(st);
  return patchRecord(st, { fin: { ...patchFin, history: [...(fin.history || []), { act, version: patchFin.version || repVersion(fin), ...stamp() }] } });
}

const Rev = { key: '', loading: false, items: [], err: '', msg: '', cls: '', sel: new Set() };
const revKey = it => it.cls.id + '__' + it.st.id;
async function loadReview() {
  const sem = semester(); if (!sem) return;
  Rev.loading = true; Rev.key = sem.id; Rev.err = '';
  try {
    const items = [];
    for (const cls of S.classes.filter(c => c.semesterId === sem.id)) {
      const sch = S.schools.find(x => x.id === cls.schoolId);
      const [students, lessons, recs] = await Promise.all([Store.list('students', 'classId', cls.id), Store.list('lessons', 'classId', cls.id), Store.list('records', 'classId', cls.id)]);
      students.sort(byOrder); lessons.sort((a, b) => a.order - b.order);
      knowStudents(students); await loadHist(students);
      const byStu = Object.fromEntries(recs.map(r => [r.studentId, r]));
      for (const st of students) {
        const rec = byStu[st.id];
        if (!reportable(st) || repStatus(rec?.fin) !== 'submitted') continue;
        const rep = reportOf(st, lessons, rec, sch, sem);
        const stats = studentStats(st.id, lessons, rec, activeComps(sch));
        items.push({ cls, sch, sem, st, lessons, rec, warnings: rep.warnings, serious: rep.warnings.filter(isSerious), status: studentStatus(stats, activeComps(sch), rec.fin) });

  } catch (e) { Rev.err = e?.message || String(e); }
  Rev.loading = false; render(true);
}

// ---------- export ----------
// mode 'approved': only students with an approved report, printed from the snapshot taken at approval (signed).
// mode 'draft': every student from live data, marked as draft and unsigned.
function exportData(cls, sch, sem, students, lessons, records, onlyStudentId, mode) {
  const comps = activeComps(sch), set = settings(), max = maxLevel(sch);
  const list = [];
  for (const st of students.filter(s => reportable(s) && (!onlyStudentId || s.id === onlyStudentId))) {
    const rec = records[st.id] || {};
    if (mode === 'approved') { const a = rec.fin?.approved; if (a?.report) list.push({ ...a.report, draft: false, version: a.version }); }
    else list.push({ ...reportOf(st, lessons, rec, sch, sem), draft: true });
  }
  return {
    title: set.title, semesterLabel: (sem.name + ' - NĂM HỌC ' + sem.year).toUpperCase(), semesterShort: sem.name,
    schoolName: sch.name, className: cls.name, comps, maxLevel: max, totalLabel: set.totalLabel,
    levels: Array.from({ length: max }, (_, i) => set.levels[i + 1]),
    overview: set.overview, signerTitle: set.signerTitle, signerName: set.signerName,
    contact: String(set.contact || '').split('\n').filter(Boolean), images: IMAGES, students: list,
  };
}
const fileSafe = s => String(s || '').normalize('NFC').replace(/[\\/:*?"<>|]+/g, '').replace(/\s+/g, '_');
async function saveFile(filename, buf) {
  const msg = $('#exportMsg');
  let dl = null; try { dl = await window.claude?.use?.('downloads'); } catch {}
  if (dl) {
    try { await dl.save({ filename, data: new Blob([buf]) }); if (msg) msg.textContent = 'Đã lưu ' + filename; return; }
    catch (e) { if (e?.code === 'declined') { if (msg) msg.textContent = 'Đã hủy lưu file.'; return; } if (msg) msg.textContent = 'Không lưu được file (' + (e?.code || 'lỗi') + ').'; return; }
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }));
  a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  if (msg) msg.textContent = 'Đã tạo ' + filename;
}
async function runExport(kind) {
  const msg = $('#exportMsg');
  if (!window.ExcelJS || !window.JSZip) { if (msg) msg.textContent = 'Chưa tải xong thư viện Excel. Đợi vài giây rồi thử lại.'; return; }
  const sch = school(), sem = semester(), mode = S.ui.expMode === 'draft' ? 'draft' : 'approved';
  const tag = mode === 'draft' ? '_NHAP' : '';
  const base = cls => 'Arkki_' + fileSafe(sch.name) + '_' + fileSafe(sem.name) + '_' + fileSafe(sem.year) + '_' + fileSafe(cls.name);
  const notes = [];
  // One class -> one workbook (one sheet per student). In approved mode, unapproved students are skipped and listed.
  const one = async (cls, students, lessons, records, onlyId, name) => {
    const data = exportData(cls, sch, sem, students, lessons, records, onlyId, mode);
    const total = onlyId ? 1 : students.filter(reportable).length;
    if (!data.students.length) { notes.push(cls.name + ': chưa có report nào được duyệt'); return 0; }
    if (data.students.length < total) notes.push(cls.name + ': ' + (total - data.students.length) + ' học sinh chưa được duyệt nên không có trong file');
    await saveFile(name + '.xlsx', await ArkkiExport.build(data));
    return data.students.length;
  };
  try {
    let n = 0;
    if (kind === 'school') {
      const classes = visClasses().filter(c => c.schoolId === sch.id && c.semesterId === sem.id);
      for (const cls of classes) {
        if (msg) msg.textContent = 'Đang tạo file lớp ' + cls.name + '…';
        const [students, lessons, recs] = await Promise.all([Store.list('students', 'classId', cls.id), Store.list('lessons', 'classId', cls.id), Store.list('records', 'classId', cls.id)]);
        students.sort(byOrder); lessons.sort((a, b) => a.order - b.order);
        knowStudents(students); await loadHist(students);
        n += await one(cls, students, lessons, Object.fromEntries(recs.map(r => [r.studentId, r])), null, base(cls) + tag);
      }
    } else {
      if (msg) msg.textContent = 'Đang tạo file…';
      const cls = klass();
      if (kind === 'one') {
        const st = S.students.find(s => s.id === S.sel.student), fin = S.records[st.id]?.fin || {};
        const ver = mode === 'approved' ? fin.approved?.version : repVersion(fin);
        n = await one(cls, S.students, S.lessons, S.records, st.id, base(cls) + '_' + fileSafe(st.name) + (st.code ? '_' + fileSafe(st.code) : '') + (ver ? '_v' + ver : '') + tag);
      } else n = await one(cls, S.students, S.lessons, S.records, null, base(cls) + tag);
    }
    if (msg) msg.textContent = (n ? 'Đã xuất ' + n + ' report' + (mode === 'draft' ? ' bản nháp' : ' đã duyệt') + '. ' : 'Không có file nào được tạo. ') +
      (notes.length ? notes.join('; ') + (mode === 'approved' ? '. Chọn "Bản nháp" nếu cần in thử.' : '.') : '');
  } catch (e) { console.error(e); if (msg) msg.textContent = 'Xuất file lỗi: ' + (e?.message || e); }
}

async function buildSchedule() {
  const F = S.ui.sf || {}, cls = klass();
  if ((F.kind || 'copy') === 'copy') {
    const src = S.classes.find(c => c.id === F.src); if (!src) throw new Error('Chọn lớp để lấy lịch.');
    let ls = (await Store.list('lessons', 'classId', src.id)).filter(l => l.date).sort((a, b) => a.date.localeCompare(b.date) || (a.order ?? 0) - (b.order ?? 0));
    const nCancel = ls.filter(l => l.cancelled).length;
    if (!F.keepCancelled) ls = ls.filter(l => !l.cancelled);
    if (!ls.length) throw new Error('Lớp ' + src.name + ' chưa có buổi học nào có ngày.');
    if (!F.start) { let d = todayStr(); while (wdOf(d) !== wdOf(ls[0].date)) d = dAdd(d, 1); F.start = d; }
    const sem = S.semesters.find(s => s.id === src.semesterId);
    return { title: 'chép ' + ls.length + ' buổi của lớp ' + src.name + ' · ' + (sem ? sem.name + ' ' + sem.year : '') + ', buổi 1 vào ' + fmtDW(F.start),
      note: !F.keepCancelled && nCancel ? 'Bỏ qua ' + nCancel + ' buổi đã hủy ở lịch cũ.' : '',
      rows: ls.map(l => ({ date: dAdd(F.start, dDiff(ls[0].date, l.date)), project: l.project || '', content: l.content || '', libId: l.libId && l.libId !== 'none' ? l.libId : '' })) };
  }
  const m = lib().modules.find(x => x.id === F.mod); if (!m) throw new Error('Chọn module.');
  const step = Math.max(1, Number(F.step) || 7), start = F.mstart || todayStr();
  const skip = new Set(String(F.skip || '').split(/[,;\s]+/).map(parseDate).filter(Boolean));
  const rows = []; let d = start, skipped = 0;
  for (const l of libLessonsOf(m.id)) {
    const n = Math.max(0, Math.min(20, Number(F['n:' + l.id] ?? l.sessions ?? 1)));
    for (let k = 1; k <= n; k++) {
      while (skip.has(d)) { d = dAdd(d, step); skipped++; }
      rows.push({ date: d, project: l.name, content: n > 1 ? 'Buổi ' + k + '/' + n : '', libId: l.id });
      d = dAdd(d, step);
    }
  }
  if (!rows.length) throw new Error('Chưa có buổi nào: kiểm tra số buổi của từng bài.');
  return { title: 'xếp module "' + m.name + '" từ ' + fmtDW(start) + ', ' + step + ' ngày một buổi', note: skipped ? 'Đã bỏ qua ' + skipped + ' ngày nghỉ.' : '', rows };
}
async function applySchedule(P) {
  const cid = S.sel.cls, used = usedLessonIds();
  const old = await Store.list('lessons', 'classId', cid);
  const kept = P.mode === 'replace' ? old.filter(l => used.has(l.id)) : old;
  const add = P.rows.filter(r => !kept.some(k => k.date === r.date && fold(k.project) === fold(r.project)));
  await write(async () => {
    for (const l of old) if (!kept.includes(l)) await Store.del('lessons', l.id);
    for (const r of add) await Store.set('lessons', uid(), { classId: cid, order: 0, date: r.date, project: r.project, content: r.content, libId: r.libId || '' });
    const all = (await Store.list('lessons', 'classId', cid)).sort((a, b) => String(a.date || '9999').localeCompare(String(b.date || '9999')) || (a.order ?? 0) - (b.order ?? 0));
    for (const [i, l] of all.entries()) if (l.order !== i + 1) await Store.update('lessons', l.id, { order: i + 1 });
  });
  return { added: add.length, removed: old.length - kept.length, kept: kept.length, same: P.rows.length - add.length };
}

    '<p class="muted small" style="margin:0">Mỗi lớp 2 giáo viên. Chỉ giáo viên được chỉ định mới thấy lớp và vào chấm, nhận xét. Đổi giáo viên thì người cũ mất quyền vào lớp, còn điểm đã chấm vẫn giữ và ghi tên người chấm. Khi hai giáo viên cùng chấm một buổi, điểm lưu theo người sửa gần nhất.</p></section>';

  // 3. Stand-ins with start and end dates
  const tmpList = schCls.flatMap(c => (c.temps || []).map(t => ({ c, t }))).sort((a, b) => String(b.t.from).localeCompare(String(a.t.from)));
  const ST = { active: '<span class="pill ok">Đang hiệu lực</span>', future: '<span class="pill blue">Sắp tới</span>', expired: '<span class="pill">Đã hết hạn</span>' };
  const tmpRows = tmpList.map(({ c, t }) => { const s = tempState(t);
    return '<tr><td>' + esc(c.name) + '</td><td><b>' + esc(tName(t.teacherId)) + '</b>' + (t.replacesId ? '<div class="muted small">thay ' + esc(tName(t.replacesId)) + '</div>' : '') + '</td>' +
      '<td class="small">' + esc(fmtDate(t.from)) + ' → ' + (t.ended ? 'kết thúc sớm lúc ' + esc(fmtWhen(t.ended.at)) + ' bởi ' + esc(t.ended.by) : esc(fmtDate(t.to))) + (t.reason ? '<div class="muted">' + esc(t.reason) + '</div>' : '') + '</td><td>' + ST[s] + '</td>' +
      '<td>' + (s === 'expired' ? '' : '<button class="btn" data-act="endTemp" data-cls="' + c.id + '" data-id="' + t.id + '">' + (s === 'future' ? 'Hủy' : 'Kết thúc ngay') + '</button>') + '</td></tr>'; }).join('');
  const tCls = schCls.find(c => c.id === T.cls) || schCls[0];
  const mains = (tCls?.teacherIds || []).filter(Boolean);
  const tmp = '<section class="panel edit" style="display:grid;gap:12px"><h3>Giáo viên tạm thời</h3>' +
    (schCls.length && active.length ? '<div class="row">' +
      '<label class="field"><span>Lớp</span><select id="tmpCls" data-act="tmpCls">' + schCls.map(c => '<option value="' + c.id + '"' + (c.id === tCls?.id ? ' selected' : '') + '>' + esc(c.name) + '</option>').join('') + '</select></label>' +
      '<label class="field"><span>Giáo viên dạy thay</span><select id="tmpT"><option value="">— chọn —</option>' + active.filter(t => !mains.includes(t.id)).map(t => '<option value="' + t.id + '">' + esc(t.name) + '</option>').join('') + '</select></label>' +
      '<label class="field"><span>Thay cho</span><select id="tmpFor"><option value="">— không ghi —</option>' + mains.map(id => '<option value="' + id + '">' + esc(tName(id)) + '</option>').join('') + '</select></label>' +
      '<label class="field"><span>Từ ngày</span><input type="date" id="tmpFrom" value="' + todayStr() + '"></label>' +
      '<label class="field"><span>Đến ngày</span><input type="date" id="tmpTo" value="' + todayStr() + '"></label>' +
      '<label class="field" style="flex:1 1 180px"><span>Lý do</span><input type="text" id="tmpReason" placeholder="Ví dụ: cô Lan đi tập huấn"></label>' +
      '<button class="btn pri" data-act="addTemp" style="align-self:end">Thêm giáo viên tạm thời</button></div><span class="small" id="tmpMsg" style="color:var(--bad)"></span>' : '') +
    (tmpRows ? '<div style="overflow-x:auto"><table><thead><tr><th>Lớp</th><th>Giáo viên tạm thời</th><th>Thời gian</th><th>Trạng thái</th><th></th></tr></thead><tbody>' + tmpRows + '</tbody></table></div>' : '<p class="muted small" style="margin:0">Chưa có giáo viên tạm thời nào ở trường này trong học kỳ đang chọn.</p>') +
    '<p class="muted small" style="margin:0">Giáo viên tạm thời vào được lớp từ ngày bắt đầu tới hết ngày kết thúc, sau đó tự mất quyền. Giáo viên chính vẫn giữ quyền trong thời gian này.</p></section>';
  return acc + asg + tmp;
}

const Staff = { loaded: false, loading: false, profiles: [], links: [], err: '' };

    const [p, l] = await Promise.all([Store.sb.from('profiles').select('*').order('created_at'), Store.sb.from('class_teachers').select('*')]);

// ---------- actions ----------
const armed = new Set();
function confirmTwice(btn, key) {
  if (armed.has(key)) { armed.delete(key); return true; }
  armed.add(key); btn.classList.add('arm'); btn.textContent = 'Bấm lần nữa để xóa';
  setTimeout(() => { armed.delete(key); if (btn.isConnected) { btn.classList.remove('arm'); btn.textContent = 'Xóa'; } }, 4000);
  return false;
}
async function delWhere(coll, field, value) { for (const r of await Store.list(coll, field, value)) await Store.del(coll, r.id); }
function saveSettings(patch) { const next = { ...settings(), ...patch }; S.settings = next; return write(() => Store.set('settings', 'main', next)); }
function updSchool(patch) { const sc = S.schools.find(s => s.id === S.sel.catSchool); Object.assign(sc, patch); return write(() => Store.update('schools', sc.id, patch)); }

$('#view').addEventListener('click', async e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act;
  if (b.tagName === 'INPUT' || b.tagName === 'TEXTAREA' || b.tagName === 'SELECT') return;
  if (act === 'lesson') { S.sel.lesson = b.dataset.id; saveSel(); render(true); }
  else if (act === 'prevLesson' || act === 'nextLesson') { const i = S.lessons.findIndex(l => l.id === S.sel.lesson) + (act === 'nextLesson' ? 1 : -1); if (S.lessons[i]) { S.sel.lesson = S.lessons[i].id; saveSel(); render(true); } }
  else if (act === 'score') {
    if (lessonReadOnly()) return;
    const st = b.dataset.st, c = b.dataset.c, v = Number(b.dataset.v);
    const cur = S.records[st]?.s?.[S.sel.lesson]?.[c];
    // Scoring a student marks them present; clearing a score leaves attendance as it is.
    const patch = { s: { [S.sel.lesson]: cur === v ? { [c]: null } : { [c]: v, att: 'present', absent: false } } };
    patchRecord(st, patch).catch(() => {}); render(true);
  }
  else if (act === 'att') {
    if (lessonReadOnly()) return;
    const v = b.dataset.v;
    patchRecord(b.dataset.st, { s: { [S.sel.lesson]: { att: v, absent: v === 'absent' } } }).catch(() => {}); render(true);
  }
  else if (act === 'doneLesson') await write(() => Store.update('lessons', S.sel.lesson, { done: stamp() }));
  else if (act === 'lockBase') { const L = S.lessons.find(l => l.id === S.sel.lesson); await write(() => Store.update('lessons', L.id, { locked: stamp(), lockLog: [...(L.lockLog || []), { act: 'lock', ...stamp() }] })); }
  else if (act === 'unlockBase') { S.ui.ask = { kind: 'unlock', lessonId: S.sel.lesson }; render(true); window.scrollTo(0, 0); }
  else if (act === 'cancelLesson') {
    const isBase = activeLessons(S.lessons)[0]?.id === S.sel.lesson;
    S.ui.ask = { kind: 'cancel', lessonId: S.sel.lesson, note: isBase ? 'Buổi này đang là mốc đầu kỳ. Hủy thì buổi kế tiếp sẽ thành mốc đầu kỳ.' : '' };
    render(true); window.scrollTo(0, 0);
  }
  else if (act === 'uncancelLesson') await write(() => Store.update('lessons', S.sel.lesson, { cancelled: false, cancelReason: '', cancelBy: null }));
  else if (act === 'askCancel') { S.ui.ask = null; render(true); }
  else if (act === 'askOk') {
    const a = S.ui.ask; if (!a) return;
    const reason = ($('#askReason')?.value || '').trim();
    if (a.kind !== 'cancel' && !reason) { $('#askErr').textContent = 'Cần ghi lý do.'; $('#askReason').focus(); return; }
    S.ui.ask = null;
    if (a.kind === 'cancel') await write(() => Store.update('lessons', a.lessonId, { cancelled: true, cancelReason: reason, cancelBy: stamp(), done: null }));
    else if (a.kind === 'unlock') { const L = S.lessons.find(l => l.id === a.lessonId); await write(() => Store.update('lessons', L.id, { locked: null, lockLog: [...(L.lockLog || []), { act: 'unlock', reason, ...stamp() }] })); }
    else if (a.kind === 'return') {
      const n = await returnItems(a.items, reason);
      if (a.from === 'rev') { Rev.items = Rev.items.filter(i => !a.items.includes(i)); a.items.forEach(i => Rev.sel.delete(revKey(i))); Rev.msg = 'Đã trả lại ' + n + ' report. Giáo viên sẽ thấy lý do ở tab Tổng hợp.'; }
      else Rev.key = '';
    }
    render(true);
  }
  // transfers, leaving, history
  else if (act === 'stMoveOpen') { S.ui.move = b.dataset.id; S.ui.mv = { kind: 'move' }; S.ui.hist = ''; render(true); }
  else if (act === 'stMoveCancel') { S.ui.move = ''; render(true); }
  else if (act === 'stMoveOk') {
    const st = S.students.find(s => s.id === b.dataset.id); if (!st) return;
    try { const msg = await moveStudent(st, S.ui.mv || {}); S.ui.move = ''; setSave('', msg); render(true); }
    catch (e) { const m = $('#mvMsg'); if (m) m.textContent = e?.message || String(e); }
  }
  else if (act === 'stMoveUndo') {
    const st = S.students.find(s => s.id === b.dataset.id); if (!st) return;
    try { setSave('', await undoMove(st)); render(true); } catch (e) { setSave('err', e?.message || String(e)); }
  }
  else if (act === 'stReturn') { await write(() => Store.update('students', b.dataset.id, { status: null, leftAt: null, leftReason: '', leftBy: null })); }
  else if (act === 'stHist') { S.ui.hist = S.ui.hist === b.dataset.id ? '' : b.dataset.id; S.ui.histData = null; S.ui.move = ''; render(true); }
  else if (act === 'histOpen') {
    const x = STU.get(b.dataset.id), c = S.classes.find(k => k.id === b.dataset.cls); if (!x || !c) return;
    Object.assign(S.sel, { sem: c.semesterId, school: c.schoolId, cls: c.id, student: x.id });
    if (reportable(x)) S.sel.tab = 'tonghop'; else { S.sel.tab = 'danhmuc'; S.sel.catTab = 'hocsinh'; }
    S.ui.hist = ''; saveSel(); fixSel(); renderCtx(); render(true); window.scrollTo(0, 0);
  }
  // quick scheduling
  else if (act === 'sfKind') { (S.ui.sf ||= {}).kind = b.dataset.v; S.ui.sched = null; render(true); }
  else if (act === 'schedPreview') {
    const m = $('#sfMsg'); if (m) m.textContent = '';
    try { const P = await buildSchedule(); S.ui.sched = { ...P, mode: S.ui.sf?.mode || 'replace' }; render(true); }
    catch (e) { if (m) m.textContent = e?.message || String(e); }
  }
  else if (act === 'schedApply') {
    const P = S.ui.sched; if (!P) return;
    S.ui.sched = null;
    const r = await applySchedule(P);
    setSave('', 'Đã thêm ' + r.added + ' buổi' + (r.removed ? ', xóa ' + r.removed + ' buổi chưa có điểm' : '') + (r.same ? ', bỏ qua ' + r.same + ' buổi đã có sẵn' : '')); render(true);
  }
  else if (act === 'schedCancel') { S.ui.sched = null; render(true); }
  // teacher accounts and assignment
  else if (act === 'addTeacher') {
    const name = $('#newTName').value.trim(), email = $('#newTEmail').value.trim(), m = $('#tMsg');
    if (!name) { m.textContent = 'Cần nhập họ tên.'; return; }
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { m.textContent = 'Email chưa đúng dạng.'; return; }
    if (staff().some(t => fold(t.email) === fold(email))) { m.textContent = 'Email này đã có tài khoản.'; return; }
    const next = staffClone(); next.teachers.push({ id: uid(), name, email, active: true, created: stamp() });
    await saveStaff(next); render(true);
  }
  else if (act === 'tLock') {
    const next = staffClone(), t = next.teachers.find(x => x.id === b.dataset.id); if (!t) return;
    t.active = t.active === false; (t.log ||= []).push({ act: t.active ? 'unlock' : 'lock', ...stamp() });
    await saveStaff(next); setSave('', (t.active ? 'Đã mở khóa ' : 'Đã khóa ') + t.name); render(true);
  }
  else if (act === 'addTemp') {
    const cls = S.classes.find(c => c.id === $('#tmpCls').value), m = $('#tmpMsg');
    const teacherId = $('#tmpT').value, from = $('#tmpFrom').value, to = $('#tmpTo').value;
    if (!cls) return;
    if (!teacherId) { m.textContent = 'Chọn giáo viên dạy thay.'; return; }
    if (!from || !to || to < from) { m.textContent = 'Ngày kết thúc phải cùng hoặc sau ngày bắt đầu.'; return; }
    const temps = [...(cls.temps || []), { id: uid(), teacherId, replacesId: $('#tmpFor').value, from, to, reason: $('#tmpReason').value.trim(), ...stamp() }];
    await write(() => Store.update('classes', cls.id, { temps })); setSave('', 'Đã thêm giáo viên tạm thời cho lớp ' + cls.name); render(true);
  }
  else if (act === 'endTemp') {
    const cls = S.classes.find(c => c.id === b.dataset.cls); if (!cls) return;
    const d = new Date(); d.setDate(d.getDate() - 1);
    const yesterday = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    // A stand-in not started yet is removed; a running one ends yesterday, so access stops now and the record stays.
    const temps = (cls.temps || []).flatMap(t => t.id !== b.dataset.id ? [t] : tempState(t) === 'future' ? [] : [{ ...t, to: yesterday, ended: stamp() }]);
    await write(() => Store.update('classes', cls.id, { temps })); render(true);
  }
  // comment picker while grading
  else if (act === 'pickOpen') { S.ui.pick = S.ui.pick === b.dataset.st ? '' : b.dataset.st; S.ui.pickComp = ''; render(true); }
  else if (act === 'pickComp') { S.ui.pickComp = b.dataset.v; render(true); }
  else if (act === 'pickText') {
    const L = S.lessons.find(l => l.id === S.sel.lesson), st = b.dataset.st;
    const c = pickPool(L, libLessonFor(L), activeComps(school())).find(x => x.id === b.dataset.cid); if (!c) return;
    queueNote(st, { s: { [L.id]: { note: toggleSentence(S.records[st]?.s?.[L.id]?.note || '', c.text) } } }); flushNote(st); render(true);
  }
  else if (act === 'finPick') { S.ui.finPick = S.ui.finPick === b.dataset.k ? '' : b.dataset.k; render(true); }
  else if (act === 'finPickText') {
    const f = S.ui.finPick, c = libComments(FIN_PICK[f]?.[0]).find(x => x.id === b.dataset.cid); if (!c) return;
    const st = S.sel.student;
    queueNote(st, { fin: { [f]: toggleSentence(S.records[st]?.fin?.[f] || '', c.text) } }); flushNote(st); render(true);
  }
  // lesson library
  else if (act === 'libPick') { S.sel.libItem = b.dataset.id; S.ui.libImport = null; S.ui.libComp = ''; S.ui.libLevel = ''; saveSel(); render(true); }
  else if (act === 'libChipComp') { S.ui.libComp = b.dataset.v; render(true); }
  else if (act === 'libChipLevel') { S.ui.libLevel = b.dataset.v; render(true); }
  else if (act === 'libAddMod') {
    const name = $('#newModName').value.trim(); if (!name) return;
    const next = libClone(), id = uid(); next.modules.push({ id, name, order: next.modules.length + 1 });

function rowsFromPaste(text) { return text.split(/\r?\n/).map(l => l.split('\t').map(x => x.trim())).filter(r => r.some(Boolean)); }
// ---------- student import: read -> check every row -> review -> save on confirmation ----------
// Decisions 16/11: preview before import, report each row, never merge students by name.
// Without a header row: guess the columns of one row (name, date of birth, code).
function parseStudentRow(cells) {
  cells = cells.map(c => c == null ? '' : String(c).trim());
  if (cells.length > 1 && /^\d{1,3}$/.test(cells[0])) cells = cells.slice(1);
  const isCode = c => !/\s/.test(c) && /\d/.test(c) && /[A-Za-z]/.test(c);
  const name = cells.find(c => /\p{L}/u.test(c) && !/\d/.test(c)) || '';
  if (/họ.*tên|^tên|^học sinh$/i.test(name)) return null;
  const dobRaw = cells.find(c => c && !isCode(c) && c !== name && /^\d{1,4}[\/.\-]\d{1,2}[\/.\-]\d{1,4}|^\d{5}$/.test(c)) || '';
  return { name, dobRaw, code: cells.find(isCode) || '', clsName: '' };
}
// Header names seen in Arkki lists: "HỌ VÀ TÊN", "Học sinh", "Mã HS", "NGÀY SINH (dd-mm-yyyy)", "Lớp", or "Họ đệm" + "Tên".
const ST_HDR = {
  cls: h => /^lop\b/.test(h),
  code: h => /^ma\b/.test(h),
  dob: h => /ngay (thang nam )?sinh|^ns$/.test(h),
  first: h => /^ho( va)?( ten)? dem$|^ho$/.test(h),
  last: h => h === 'ten',
  name: h => /^(hoc sinh|ten hoc sinh)$/.test(h) || (/\bho\b/.test(h) && /\bten\b/.test(h) && !/dem/.test(h)),
};
function mapHeader(rows) {
  for (let i = 0; i < Math.min(rows.length, 15); i++) {
    const col = {};
    (rows[i] || []).map(fold).forEach((h, j) => { if (h) for (const [k, f] of Object.entries(ST_HDR)) if (col[k] == null && f(h)) { col[k] = j; break; } });
    if (col.name != null || (col.first != null && col.last != null)) return { at: i, col };
  }
  return null;
}
function studentRowsFrom(rows) {
  const H = mapHeader(rows), cell = (r, j) => j == null ? '' : String(r[j] ?? '').trim();
  if (!H) return { header: false, rows: rows.map(parseStudentRow).filter(r => r && r.name) };
  const { col } = H;
  const out = rows.slice(H.at + 1).map(r => ({
    name: col.name != null ? cell(r, col.name) : (cell(r, col.first) + ' ' + cell(r, col.last)).trim(),
    dobRaw: cell(r, col.dob), code: cell(r, col.code), clsName: cell(r, col.cls),
  })).filter(r => r.name || r.dobRaw || r.code);
  return { header: true, cols: Object.keys(col), rows: out };
}
const validIso = s => !!s && /^\d{4}-\d{2}-\d{2}$/.test(s) && new Date(s + 'T00:00:00Z').toISOString().slice(0, 10) === s;
// "NGUYỄN VĂN AN" -> "Nguyễn Văn An"; names typed normally are kept as they are.
const tidyName = s => { s = String(s || '').normalize('NFC').replace(/\s+/g, ' ').trim(); return s && s === s.toUpperCase() && /\p{L}/u.test(s) ? s.toLowerCase().replace(/(^|\s|\()(\p{L})/gu, (m, a, b) => a + b.toUpperCase()) : s; };
function startStudentImport(source, parsed) {
  const curSem = S.sel.sem, curSch = S.sel.school;
  const classes = S.classes.filter(c => c.semesterId === curSem && c.schoolId === curSch);
  const rows = parsed.rows.map((r, i) => {
    const m = r.clsName ? classes.find(c => fold(c.name) === fold(r.clsName)) : klass();
    return { i, name: tidyName(r.name), dobRaw: r.dobRaw || '', code: (r.code || '').trim(), clsName: r.clsName || '', cls: m?.id || '', sel: true };
  });
  S.ui.stImp = { source, header: parsed.header, cols: parsed.cols || [], rows, existing: {}, loading: true };
  for (const r of rows) r.sel = !['error', 'dup'].includes(checkStudentRow(r).level);
  render(true);
  // Load the students already in every target class, then check duplicates against them.
  const ids = [...new Set(rows.map(r => r.cls).filter(Boolean))];
  Promise.all(ids.map(id => Store.list('students', 'classId', id).then(l => [id, l]))).then(list => {
    const imp = S.ui.stImp; if (!imp) return;
    imp.existing = Object.fromEntries(list); imp.loading = false;
    for (const r of imp.rows) r.sel = !['error', 'dup'].includes(checkStudentRow(r).level);
    render(true);
  });
}
function checkStudentRow(r) {
  const imp = S.ui.stImp, msgs = [];
  let level = 'ok';
  const up = l => { const o = ['ok', 'warn', 'dup', 'error']; if (o.indexOf(l) > o.indexOf(level)) level = l; };
  if (!r.name) { msgs.push('Thiếu họ tên'); up('error'); }
  else if (/\d/.test(r.name)) { msgs.push('Tên có chữ số'); up('warn'); }
  if (!r.cls) { msgs.push(r.clsName ? 'Không có lớp "' + r.clsName + '" ở trường và học kỳ đang chọn' : 'Chưa chọn lớp'); up('error'); }
  const dob = parseDate(r.dobRaw);
  if (r.dobRaw && !validIso(dob)) { msgs.push('Ngày sinh "' + r.dobRaw + '" không đọc được'); up('error'); }
  else if (!r.dobRaw) { msgs.push('Thiếu ngày sinh'); up('warn'); }
  else { const age = new Date().getFullYear() - Number(dob.slice(0, 4)); if (age < 2 || age > 20) { msgs.push('Ngày sinh ' + fmtDate(dob) + ' lạ với tuổi học sinh'); up('warn'); } }
  const ex = imp?.existing?.[r.cls] || [];
  if (r.code && ex.some(s => fold(s.code) === fold(r.code))) { msgs.push('Lớp đã có học sinh mã ' + r.code); up('dup'); }
  else {
    const same = ex.filter(s => fold(s.name) === fold(r.name));
    if (r.name && same.length) { msgs.push('Trùng tên với học sinh đang có' + (r.code && same.some(s => s.code && fold(s.code) !== fold(r.code)) ? ', khác mã' : '') + ': sẽ thêm thành người mới, không gộp'); up('warn'); }
  }
  if (r.name && imp?.rows.some(o => o !== r && o.cls === r.cls && fold(o.name) === fold(r.name) && o.i < r.i)) { msgs.push('Lặp lại một dòng phía trên'); up('warn'); }
  return { level, msgs, dob: validIso(dob) ? dob : '' };
}

async function saveStudentImport() {
  const imp = S.ui.stImp; if (!imp) return;

  await write(async () => {
    for (const r of rows) {

      const id = uid(), dob = checkStudentRow(r).dob;
      await Store.set('students', id, { classId: r.cls, name: r.name, dob, code: r.code, order: ++order[r.cls] });

  });
  S.ui.stImp = null; const ta = $('#pasteStudents'); if (ta) ta.value = '';

// A workbook may hold the list on any sheet, next to grading sheets that repeat every name many times
// (Clover files: "Danh sách lớp", "Nhận xét cuối kỳ", one sheet per student, hidden logs). A class list has each name once.
function sheetScore(s, p) {
  const names = p.rows.map(r => fold(r.name)).filter(Boolean), uniq = new Set(names).size, dup = names.length - uniq;
  return (p.header ? 2000 : 0) + (dup ? 0 : 1000) + (/danh sach/.test(fold(s.name)) ? 500 : 0) - (s.hidden ? 1500 : 0) + uniq - 2 * dup - 2 * names.filter(n => /\d/.test(n)).length;
}
async function readStudentFile(file) {
  const sheets = await readXlsxRows(await file.arrayBuffer());
  const cands = sheets.map(s => { const p = studentRowsFrom(s.rows); return { name: s.name, hidden: s.hidden, p, score: sheetScore(s, p) }; })
    .filter(c => c.p.rows.length).sort((a, b) => b.score - a.score);
  if (!cands.length) throw new Error('Không thấy danh sách học sinh trong file.');
  startStudentImport(file.name, cands[0].p);
  if (cands.length > 1) { S.ui.stImp.sheets = cands; S.ui.stImp.sheet = 0; render(true); }
}

const COLLS = ['semesters', 'schools', 'classes', 'students', 'lessons', 'records', 'settings'];

  const opts = [['manager', 'Quản lý chuyên môn']].concat(ts.length
    ? ts.map(t => ['t:' + t.id, 'GV ' + t.name + (t.active === false ? ' (đã khóa)' : '')])
    : [['teacher', 'Giáo viên (chưa có tài khoản, thấy mọi lớp)']]);
  let v = lsGet('arkki-me') || 'manager';
  // Once accounts are loaded, a saved choice that no longer exists falls back to the manager.
  if (S.staffLoaded && !opts.some(o => o[0] === v)) { v = 'manager'; lsSet('arkki-me', v); }
  S.me = localMe(v);
  const w = $('#who'); w.hidden = false;
  w.innerHTML = '<span class="muted">Dùng thử với vai trò</span><select id="localRole" aria-label="Vai trò dùng thử">' +
    opts.map(([k, l]) => '<option value="' + esc(k) + '"' + (k === v ? ' selected' : '') + '>' + esc(l) + '</option>').join('') + '</select>';
}
document.addEventListener('change', e => {
  if (e.target.id !== 'localRole') return;
  lsSet('arkki-me', e.target.value); S.me = localMe(e.target.value); S.ui.ask = null; S.ui.pick = '';
  fixSel(); renderCtx(); render(true);
});

// ---------- boot ----------
(async () => {
  await Store.init();
  if (Store.mode === 'supabase') {
    let recovering = /type=recovery/.test(location.hash);
    Store.sb.auth.onAuthStateChange(ev => {
      if (ev === 'PASSWORD_RECOVERY') { recovering = true; showAuth('reset'); }
      else if (ev === 'SIGNED_IN' && !recovering && !appStarted) startApp();
      else if (ev === 'SIGNED_OUT') location.reload();
    });
    if (recovering) return showAuth('reset');
    return startApp();
  }
  renderWho();
  renderCtx(); render(true);
  if (Store.mode === 'db') {
    try { const u = await window.claude.use('user'); const can = u?.can ? await u.can('data.write') : null; if (can === false) { S.canWrite = false; setSave('err', 'Bạn chỉ có quyền xem.'); } } catch {}
  } else setSave('', 'Chế độ thử: lưu trên máy này');
  appStarted = true;
  subscribeGlobal();
})();
})();
</script>
